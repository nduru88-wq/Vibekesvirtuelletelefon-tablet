<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Vibekes telefon</title>

<link rel="apple-touch-icon" sizes="180x180" href="telefon.png" />
<link rel="apple-touch-icon" href="telefon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Vibekes telefon" />

<style>
:root{
  --bg:#0b1220;
  --text:#fff;
  --muted:rgba(255,255,255,.75);
  --stroke:rgba(255,255,255,.12);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --radius:22px;

  --gap:14px;

  /* Header icon */
  --iconSize: 92px;

  /* Info bar (auto, but comfortable) */
  --infoPadY: 10px;
  --infoPadX: 12px;
}

*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  touch-action:manipulation;
}

html,body{
  height:100%;
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  overflow:hidden; /* 🔒 ingen scroll */
}

body{
  background:
    radial-gradient(1200px 800px at 50% 0%, rgba(80,140,255,.22), transparent 55%),
    radial-gradient(900px 600px at 10% 90%, rgba(0,255,170,.10), transparent 55%),
    var(--bg);
  color:var(--text);
}

.page{
  height:100%;
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
  display:flex;
  justify-content:center;
}

.wrap{
  width:100%;
  max-width:1200px;
  height:100%;
  display:flex;
  flex-direction:column;
  gap:12px;
  min-height:0; /* vigtigt når grid skal kunne shrinke */
}

/* Header */
.header{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;

  padding:10px 12px;
  border-radius:var(--radius);
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.045);
  box-shadow:var(--shadow);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.headLeft{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.topIcon{
  width:var(--iconSize);
  height:var(--iconSize);
  border-radius:22px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--stroke);
  box-shadow:0 10px 30px rgba(0,0,0,.35);
  display:grid;
  place-items:center;
  animation: iconBreath 4.2s ease-in-out infinite;
  transform-origin:center;
  flex:0 0 auto;
}
@keyframes iconBreath{
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.035); }
}
.topIcon img{
  width:75%;
  height:75%;
  object-fit:contain;
}

.headText{
  min-width:0;
}

h1{
  margin:0;
  font-size:clamp(18px,2.2vw,26px);
  line-height:1.05;
}
.hint{
  margin:2px 0 0;
  color:rgba(255,255,255,.82);
  font-size:clamp(12px,1.6vw,14px);
}

/* Toggle */
.toggle{
  flex:0 0 auto;
  display:flex;
  gap:8px;
  padding:6px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(0,0,0,.35);
}

.toggle button{
  appearance:none;
  border:0;
  padding:10px 12px;
  border-radius:999px;
  font-weight:900;
  font-size:14px;
  color:rgba(255,255,255,.85);
  background:transparent;
  line-height:1.1;
}
.toggle button[aria-pressed="true"]{
  color:#0b1220;
  background:rgba(0,255,170,.95);
}
.toggle small{
  display:block;
  font-weight:700;
  opacity:.9;
  font-size:12px;
}

/* 🔥 Grid: låst 4x2 uden scroll */
.grid{
  flex:1 1 auto;
  min-height:0;
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  grid-template-rows:repeat(2, 1fr);
  gap:var(--gap);
}

/* Card */
.card{
  text-decoration:none;
  color:inherit;
  border-radius:var(--radius);
  border:1px solid var(--stroke);
  box-shadow:var(--shadow);
  overflow:hidden;
  background:rgba(255,255,255,.06);

  display:flex;
  flex-direction:column;

  height:100%;            /* fyld cellen */
  min-height:0;           /* allow shrink */
  -webkit-tap-highlight-color:transparent;
  transform:translateZ(0);
}
.card:active{ transform:scale(.985); }

/* Photo zone: fylder det meste */
.photo{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
  background:rgba(255,255,255,.05);
}
.photo img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}
.initial{
  font-size:clamp(34px,4vw,52px);
  font-weight:900;
  opacity:.95;
}

/* Info bar */
.info{
  flex:0 0 auto;
  background:rgba(0,0,0,.90);
  border-top:1px solid rgba(255,255,255,.10);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:var(--infoPadY) var(--infoPadX);
  gap:10px;
}

.name{
  margin:0;
  font-weight:900;
  font-size:clamp(16px,1.8vw,20px);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  letter-spacing:.2px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 10px;
  border-radius:999px;
  background:rgba(0,255,170,.18);
  border:1px solid rgba(0,255,170,.35);
  font-weight:800;
  font-size:clamp(11px,1.3vw,13px);
  line-height:1;
  white-space:nowrap;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#00ffaa;
  position:relative;
}
.dot::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:#00ffaa;
  animation:pulse 2.5s infinite ease-out;
}
@keyframes pulse{
  0%{ transform:scale(1); opacity:.7; }
  70%{ transform:scale(2.2); opacity:0; }
  100%{ opacity:0; }
}

/* Små justeringer hvis nogen bruger mobil */
@media (max-width: 700px){
  :root{
    --gap:12px;
    --iconSize: 74px;
    --infoPadY: 9px;
    --infoPadX: 10px;
  }
  .grid{
    grid-template-columns:repeat(2, 1fr);
    grid-template-rows:auto;
    overflow:auto;
  }
  html,body{ overflow:auto; }
}
</style>
</head>

<body>
<div class="page"><div class="wrap">

<header class="header">
  <div class="headLeft">
    <div class="topIcon"><img src="telefon.png" alt=""></div>
    <div class="headText">
      <h1>Vibekes telefon</h1>
      <p class="hint">Tryk på billede for opkald</p>
    </div>

  <div class="toggle" role="group" aria-label="Opkald via">

    </button>
    <button id="btnWa" type="button" aria-pressed="false">
      WhatsApp<br><small>åbner chat</small>
    </button>

</header>

<main class="grid">

  <a class="card" href="#" data-name="Peter" data-phone="+4520324378" aria-label="Ring til Peter">

      <img src="peter.jpg" alt="Peter"

  <a class="card" href="#" data-name="Bente" data-phone="+4528223687" aria-label="Ring til Bente">

           onerror="this.remove(); this.parentElement.innerHTML='<div class=&quot;initial&quot;>B</div>';">

    <div class="info">
      <p class="name">Bente</p>
      <span class="badge"><span class="dot"></span> RING</span>
    </div>

  <a class="card" href="#" data-name="Britta" data-phone="+4523985223" aria-label="Ring til Britta">
    <div class="photo">

<script>
function tinyVibrate() {
  try { if (navigator.vibrate) navigator.vibrate(20); } catch(e) {}
}

const STORAGE_KEY = "vibeke_call_method"; // "tel" eller "wa"
let method = localStorage.getItem(STORAGE_KEY) || "tel";

const btnTel = document.getElementById("btnTel");
const btnWa  = document.getElementById("btnWa");

function setMethod(m){
  method = m;
  localStorage.setItem(STORAGE_KEY, method);
  btnTel.setAttribute("aria-pressed", method === "tel" ? "true" : "false");
  btnWa.setAttribute("aria-pressed",  method === "wa"  ? "true" : "false");
}

btnTel.addEventListener("click", () => { tinyVibrate(); setMethod("tel"); });
btnWa.addEventListener("click",  () => { tinyVibrate(); setMethod("wa");  });

setMethod(method);

// Renser nummer til WhatsApp (skal være internationalt uden +, mellemrum osv.)
function normalizePhoneForWa(phone){
  return (phone || "").replace(/[^\d]/g, "");
}

// Åbn WhatsApp: prøv app-scheme først, fallback til wa.me
function openWhatsApp(phone, name){
  const p = normalizePhoneForWa(phone);
  const text = encodeURIComponent("Hej " + name + " – kan du ringe til mig?");
  const appUrl = "whatsapp://send?phone=" + p + "&text=" + text;
  const webUrl = "https://wa.me/" + p + "?text=" + text;

  window.location.href = appUrl;
  setTimeout(() => {
    window.location.href = webUrl;
  }, 450);
}

document.querySelectorAll('.card').forEach(card => {
  card.addEventListener('click', (e) => {
    e.preventDefault();
    tinyVibrate();

    const name  = card.getAttribute("data-name")  || "";
    const phone = card.getAttribute("data-phone") || "";

    if(method === "wa"){
      openWhatsApp(phone, name);
    }else{
      window.location.href = "tel:" + phone;
    }
  }, { passive: false });
});

// Lås pinch-zoom
['gesturestart','gesturechange','gestureend'].forEach(evt => {
  document.addEventListener(evt, function(e){ e.preventDefault(); }, { passive: false });
});
</script>

</body>
